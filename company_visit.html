<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>来訪者応接記録用紙</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;600;700&display=swap');

  :root {
    --bg: #0f1117;
    --bg2: #161922;
    --surface: #1c2030;
    --surface2: #232838;
    --border: #2e3448;
    --border-light: #252b3b;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,168,76,0.12);
    --gold-glow: rgba(201,168,76,0.25);
    --accent: #4a8fe8;
    --accent-light: rgba(74,143,232,0.12);
    --text: #e8eaf0;
    --text-sub: #9ba3b8;
    --text-muted: #5c6480;
    --danger: #e05252;
    --danger-dim: rgba(224,82,82,0.12);
    --success: #4caf82;
    --success-dim: rgba(76,175,130,0.12);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.6);
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.07) 0%, transparent 70%);
  }

  /* ===== WRAPPER ===== */
  .main-wrap {
    background: var(--bg2);
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg), 0 0 0 1px rgba(201,168,76,0.08);
    overflow: hidden;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ===== HEADER ===== */
  .app-header {
    background: linear-gradient(135deg, #0d1520 0%, #1a2235 50%, #0f1a2a 100%);
    border-bottom: 1px solid var(--border);
    padding: 22px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }
  .app-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(201,168,76,0.04) 50%, transparent 100%);
    pointer-events: none;
  }
  .app-header::after {
    content: '';
    position: absolute;
    bottom: 0; left: 32px; right: 32px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }
  .app-header h1 {
    font-family: 'Shippori Mincho', serif;
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(201,168,76,0.3);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .app-header h1 .icon-badge {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--gold), #a07830);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem;
    box-shadow: 0 4px 12px rgba(201,168,76,0.3);
  }
  .app-header .subtitle {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ===== TABS ===== */
  .tabs {
    display: flex;
    background: #0d1118;
    padding: 0 32px;
    gap: 2px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 12px 26px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    transition: all 0.22s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    position: relative;
  }
  .tab:hover { color: var(--text-sub); }
  .tab.active {
    color: var(--gold-light);
    border-bottom-color: var(--gold);
  }

  /* ===== VIEW ===== */
  .view { display: none; padding: 28px 32px; }
  .view.active { display: block; }

  /* ===== BUTTONS ===== */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border: none; border-radius: 7px;
    font-family: inherit; font-size: 0.8rem; font-weight: 500;
    cursor: pointer; transition: all 0.18s; letter-spacing: 0.05em;
    white-space: nowrap; position: relative;
  }
  .btn-primary {
    background: linear-gradient(135deg, #3a7bd5, #2563b8);
    color: #fff;
    box-shadow: 0 2px 12px rgba(58,123,213,0.3);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(58,123,213,0.4); }
  .btn-success {
    background: linear-gradient(135deg, #3d9e70, #2d7a55);
    color: #fff;
    box-shadow: 0 2px 12px rgba(61,158,112,0.3);
  }
  .btn-success:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(61,158,112,0.4); }
  .btn-danger {
    background: linear-gradient(135deg, #d94f4f, #b83535);
    color: #fff;
    box-shadow: 0 2px 8px rgba(217,79,79,0.25);
  }
  .btn-danger:hover { transform: translateY(-1px); }
  .btn-outline {
    background: rgba(255,255,255,0.04);
    color: var(--text-sub);
    border: 1px solid var(--border);
    backdrop-filter: blur(4px);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold-light); background: var(--gold-dim); }
  .btn-sm { padding: 5px 11px; font-size: 0.75rem; }

  /* header buttons special */
  .header-actions .btn-outline {
    color: rgba(255,255,255,0.6);
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.04);
  }
  .header-actions .btn-outline:hover {
    color: var(--gold-light); border-color: var(--gold); background: var(--gold-dim);
  }

  /* ===== FORM CARD ===== */
  .form-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border-light);
    overflow: hidden;
    margin-bottom: 18px;
    transition: box-shadow 0.2s;
  }
  .form-card:hover { box-shadow: 0 0 0 1px rgba(201,168,76,0.1), 0 8px 32px rgba(0,0,0,0.3); }
  .form-card-header {
    background: linear-gradient(90deg, var(--surface2), var(--surface));
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.12em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .form-card-header::before {
    content: '';
    width: 3px; height: 14px;
    background: linear-gradient(180deg, var(--gold), #a07830);
    border-radius: 2px;
    flex-shrink: 0;
  }
  .form-card-body { padding: 20px; }

  /* ===== FORM LAYOUT ===== */
  .form-top-bar {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .form-top-bar .left { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }

  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-group label {
    font-size: 0.72rem; color: var(--text-muted); font-weight: 500;
    letter-spacing: 0.07em; text-transform: uppercase;
  }
  .field-group input[type="text"],
  .field-group input[type="date"],
  .field-group input[type="time"],
  .field-group input[type="number"],
  .field-group select,
  .field-group textarea {
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 0.85rem;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.15s, box-shadow 0.15s;
    outline: none;
  }
  .field-group input:focus,
  .field-group select:focus,
  .field-group textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-dim);
  }
  .field-group input::placeholder,
  .field-group textarea::placeholder { color: var(--text-muted); }
  .field-group textarea { resize: vertical; min-height: 70px; }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

  /* ===== CHECKBOXES ===== */
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .cb-label {
    display: inline-flex; align-items: center; gap: 7px;
    cursor: pointer; font-size: 0.82rem; padding: 6px 12px;
    border-radius: 6px; border: 1px solid var(--border-light);
    transition: all 0.15s; user-select: none; white-space: nowrap;
    color: var(--text-sub); background: var(--bg);
  }
  .cb-label:hover { border-color: var(--gold); color: var(--gold-light); background: var(--gold-dim); }
  .cb-label input[type="checkbox"] { display: none; }
  .cb-box {
    width: 15px; height: 15px; border: 1.5px solid var(--border);
    border-radius: 3px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; background: var(--surface2);
  }
  .cb-label input:checked + .cb-box {
    background: linear-gradient(135deg, var(--gold), #a07830);
    border-color: var(--gold);
  }
  .cb-label input:checked + .cb-box::after { content: '✓'; color: #1a1200; font-size: 10px; font-weight: 900; }
  .cb-label input:checked ~ .cb-text { color: var(--gold-light); font-weight: 600; }
  .cb-label:has(input:checked) { border-color: var(--gold); background: var(--gold-dim); }

  .radio-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .rb-label {
    display: inline-flex; align-items: center; gap: 7px;
    cursor: pointer; font-size: 0.82rem; padding: 6px 12px;
    border-radius: 6px; border: 1px solid var(--border-light);
    transition: all 0.15s; user-select: none;
    color: var(--text-sub); background: var(--bg);
  }
  .rb-label:hover { border-color: var(--gold); color: var(--gold-light); background: var(--gold-dim); }
  .rb-label input[type="radio"] { display: none; }
  .rb-box {
    width: 15px; height: 15px; border: 1.5px solid var(--border);
    border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s; background: var(--surface2);
  }
  .rb-label input:checked + .rb-box { border-color: var(--gold); }
  .rb-label input:checked + .rb-box::after {
    content: ''; width: 7px; height: 7px; border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
  }
  .rb-label input:checked ~ .rb-text { color: var(--gold-light); font-weight: 600; }
  .rb-label:has(input:checked) { border-color: var(--gold); background: var(--gold-dim); }

  /* ===== REGION TABLE ===== */
  .region-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .region-table th {
    background: var(--surface2);
    color: var(--gold);
    padding: 9px 14px; text-align: center; font-weight: 600;
    border: 1px solid var(--border); font-size: 0.75rem;
    letter-spacing: 0.08em;
  }
  .region-table td { border: 1px solid var(--border-light); padding: 6px 12px; text-align: center; }
  .region-table tr:hover td { background: rgba(201,168,76,0.04); }

  /* ===== LIST VIEW ===== */
  .list-controls {
    display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap;
  }
  .search-box {
    flex: 1; min-width: 200px;
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 16px; font-family: inherit; font-size: 0.85rem; outline: none;
    transition: all 0.15s; background: var(--surface); color: var(--text);
  }
  .search-box::placeholder { color: var(--text-muted); }
  .search-box:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }

  .records-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  .records-table thead tr {
    background: linear-gradient(90deg, #0d1118, #131825);
    border-bottom: 1px solid var(--gold);
  }
  .records-table th {
    color: var(--gold);
    padding: 11px 14px; text-align: left; font-weight: 600;
    letter-spacing: 0.08em; white-space: nowrap; font-size: 0.74rem;
  }
  .records-table td {
    padding: 11px 14px; border-bottom: 1px solid var(--border-light);
    vertical-align: middle; color: var(--text-sub);
  }
  .records-table td strong { color: var(--text); font-weight: 600; }
  .records-table tbody tr { transition: background 0.15s; }
  .records-table tbody tr:hover td { background: rgba(201,168,76,0.05); color: var(--text); }
  .records-table .actions { display: flex; gap: 6px; justify-content: center; }

  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 20px;
    font-size: 0.72rem; font-weight: 700; white-space: nowrap; letter-spacing: 0.06em;
  }
  .badge-employment {
    background: rgba(74,143,232,0.15); color: #6bb3f5;
    border: 1px solid rgba(74,143,232,0.3);
  }
  .badge-education {
    background: rgba(76,175,130,0.15); color: #6dd4a8;
    border: 1px solid rgba(76,175,130,0.3);
  }

  .empty-state {
    text-align: center; padding: 70px 20px; color: var(--text-muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 14px; opacity: 0.3; }
  .empty-state p { font-size: 0.88rem; line-height: 1.7; }

  /* ===== SECTION TITLE ===== */
  .section-title {
    font-size: 0.72rem; font-weight: 700; color: var(--gold);
    letter-spacing: 0.12em; text-transform: uppercase;
    margin: 20px 0 10px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 20px; height: 1px;
    background: var(--gold); display: inline-block;
  }

  /* ===== ALERT ===== */
  .alert {
    padding: 12px 18px; border-radius: 8px; margin-bottom: 18px;
    font-size: 0.84rem; display: flex; align-items: center; gap: 10px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .alert-success {
    background: var(--success-dim); color: #6dd4a8;
    border: 1px solid rgba(76,175,130,0.3);
  }
  .alert-error {
    background: var(--danger-dim); color: #f08080;
    border: 1px solid rgba(224,82,82,0.3);
  }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(6px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 14px; padding: 32px;
    max-width: 420px; width: 90%;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    animation: slideUp 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes slideUp { from { transform: translateY(24px) scale(0.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 { margin-bottom: 12px; color: var(--danger); font-size: 1rem; }
  .modal p { font-size: 0.86rem; color: var(--text-sub); margin-bottom: 24px; line-height: 1.7; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* ===== DETAIL VIEW ===== */
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .detail-item { padding: 10px 14px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border-light); }
  .detail-item .label { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 4px; }
  .detail-item .value { font-size: 0.88rem; font-weight: 500; }
  .detail-item.full { grid-column: 1/-1; }

  /* ===== STATS ===== */
  .stats-bar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat-card {
    flex: 1; min-width: 120px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border-light);
    padding: 16px 20px; text-align: center;
    position: relative; overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .stat-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .stat-card:hover::before { opacity: 1; }
  .stat-card .num {
    font-family: 'Shippori Mincho', serif;
    font-size: 2rem; font-weight: 700; color: var(--gold-light);
    line-height: 1;
  }
  .stat-card .lbl { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; letter-spacing: 0.06em; }

  /* ===== SELECT in list ===== */
  select.btn-outline {
    background: var(--surface); color: var(--text-sub);
    border: 1px solid var(--border); border-radius: 8px;
  }
  select.btn-outline:hover { border-color: var(--gold); color: var(--gold-light); }
  select.btn-outline option { background: var(--surface2); color: var(--text); }

  .records-table th.sortable {
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .records-table th.sortable:hover { color: var(--gold-light); }
  .records-table th.sort-active { color: var(--gold-light); }
  .sort-icon { font-size: 0.7rem; opacity: 0.6; margin-left: 3px; }
  .sort-active .sort-icon { opacity: 1; color: var(--gold); }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .detail-grid { grid-template-columns: 1fr; }
    .view { padding: 16px; }
    .app-header { padding: 16px; }
    .tabs { padding: 0 16px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="main-wrap">
  <div class="app-header">
    <div>
      <h1><span class="icon-badge">📋</span>来訪者応接記録</h1>
      <div class="subtitle">VISITOR RECEPTION RECORD SYSTEM</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline" onclick="exportExcel()">📊 Excel出力</button>
      <button class="btn btn-outline" onclick="exportJSON()">💾 エクスポート</button>
      <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">📂 インポート</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(this)">
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('form')">＋ 新規記録</div>
    <div class="tab" onclick="switchTab('list')">≡ 記録一覧</div>
  </div>

  <!-- ===== FORM VIEW ===== -->
  <div class="view active" id="view-form">
    <div id="formAlert"></div>

    <!-- TOP: 種別・受付No・担当者 -->
    <div class="form-card">
      <div class="form-card-header">基本情報</div>
      <div class="form-card-body">
        <div class="form-top-bar">
          <div class="left">
            <div class="field-group">
              <label>種　別</label>
              <div class="radio-group">
                <label class="rb-label"><input type="radio" name="category" value="就職" checked><span class="rb-box"></span><span class="rb-text">就　職</span></label>
                <label class="rb-label"><input type="radio" name="category" value="進学"><span class="rb-box"></span><span class="rb-text">進　学</span></label>
              </div>
            </div>
            <div class="field-group">
              <label>受付 No. <span style="font-size:0.72rem;color:var(--gold);font-weight:400;letter-spacing:0.04em;">自動採番</span></label>
              <input type="text" id="f_receiptNo" readonly style="width:140px;background:var(--bg2);cursor:default;font-weight:700;color:var(--gold-light);letter-spacing:0.12em;border-color:var(--border)">
            </div>
            <div class="field-group">
              <label>担当応対者</label>
              <input type="text" id="f_handler" placeholder="担当者名" style="width:160px;">
            </div>
          </div>
          <div id="editingId" style="display:none;"></div>
        </div>

        <div class="grid-3" style="gap:12px;">
          <div class="field-group">
            <label>来訪日</label>
            <input type="date" id="f_date">
          </div>
          <div class="field-group">
            <label>曜日</label>
            <input type="text" id="f_weekday" placeholder="自動入力" readonly style="background:var(--bg2);cursor:default;color:var(--text-sub);">
          </div>
          <div class="field-group">
            <label>来訪時刻</label>
            <input type="time" id="f_time">
          </div>
        </div>
      </div>
    </div>

    <!-- 企業情報 -->
    <div class="form-card">
      <div class="form-card-header">企業情報</div>
      <div class="form-card-body">
        <div class="grid-2" style="margin-bottom:14px;">
          <div class="field-group">
            <label>企　業　名</label>
            <input type="text" id="f_company" placeholder="企業名を入力">
          </div>
          <div class="field-group">
            <label>訪問者氏名</label>

    <!-- 業務内容 & 性別・推薦・学科 -->
    <div class="grid-2" style="gap:16px;">

            <label class="cb-label"><input type="checkbox" data-field="work" value="販売"><span class="cb-box"></span><span class="cb-text">販　売</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="サービス"><span class="cb-box"></span><span class="cb-text">サービス</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="製造（土石・金属材料・化学製品）"><span class="cb-box"></span><span class="cb-text">製造（土石・金属材料・化学製品）</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="製造（金属製品・機械製品）"><span class="cb-box"></span><span class="cb-text">製造（金属製品・機械製品）</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="製造（飲料・食料品）"><span class="cb-box"></span><span class="cb-text">製造（飲料・食料品）</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="製造（紡績・衣料・繊維製品）"><span class="cb-box"></span><span class="cb-text">製造（紡績・衣料・繊維製品）</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="製造（その他製造）"><span class="cb-box"></span><span class="cb-text">製造（その他製造）</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="建設・機械・電気作業"><span class="cb-box"></span><span class="cb-text">建設・機械・電気作業</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="採掘"><span class="cb-box"></span><span class="cb-text">採　掘</span></label>
            <label class="cb-label"><input type="checkbox" data-field="work" value="その他の職業"><span class="cb-box"></span><span class="cb-text">その他の職業</span></label>
          </div>

      <div style="display:flex;flex-direction:column;gap:16px;">
        <!-- 性別 -->
        <div class="form-card">
          <div class="form-card-header">性　　別</div>
          <div class="form-card-body">
            <div class="radio-group">
              <label class="rb-label"><input type="radio" name="gender" value="男"><span class="rb-box"></span><span class="rb-text">男</span></label>
              <label class="rb-label"><input type="radio" name="gender" value="女"><span class="rb-box"></span><span class="rb-text">女</span></label>
              <label class="rb-label"><input type="radio" name="gender" value="不問"><span class="rb-box"></span><span class="rb-text">不　問</span></label>
            </div>
          </div>
        </div>

        <!-- 推薦人数 -->
        <div class="form-card">
          <div class="form-card-header">推　薦　人　数</div>
          <div class="form-card-body">
            <div class="checkbox-group" style="margin-bottom:10px;">
              <label class="cb-label"><input type="checkbox" id="rec1" value="1" onchange="toggleRecOther()"><span class="cb-box"></span><span class="cb-text">1 名</span></label>
              <label class="cb-label"><input type="checkbox" id="rec2" value="2" onchange="toggleRecOther()"><span class="cb-box"></span><span class="cb-text">2 名</span></label>
              <label class="cb-label"><input type="checkbox" id="recOtherCb" value="other" onchange="toggleRecOther()"><span class="cb-box"></span><span class="cb-text">その他</span></label>
            </div>
            <div class="field-group" id="recOtherWrap" style="display:none;">
              <label>人数を入力</label>
              <input type="number" id="f_recOther" min="1" style="width:100px;">
            </div>
          </div>
        </div>

        <!-- 募集・学科 -->
        <div class="form-card">
          <div class="form-card-header">募集・学科</div>
          <div class="form-card-body">
            <div class="checkbox-group">
              <label class="cb-label"><input type="checkbox" data-field="dept" value="S"><span class="cb-box"></span><span class="cb-text">S</span></label>
              <label class="cb-label"><input type="checkbox" data-field="dept" value="G"><span class="cb-box"></span><span class="cb-text">G</span></label>
              <label class="cb-label"><input type="checkbox" data-field="dept" value="A"><span class="cb-box"></span><span class="cb-text">A</span></label>
              <label class="cb-label"><input type="checkbox" data-field="dept" value="M"><span class="cb-box"></span><span class="cb-text">M</span></label>
              <label class="cb-label"><input type="checkbox" data-field="dept" value="B"><span class="cb-box"></span><span class="cb-text">B</span></label>
              <label class="cb-label"><input type="checkbox" data-field="dept" value="不問"><span class="cb-box"></span><span class="cb-text">不　問</span></label>
            </div>
          </div>
        </div>

        <!-- 資料等 -->
        <div class="form-card">
          <div class="form-card-header">資　料　等</div>
          <div class="form-card-body">
            <div class="checkbox-group" style="flex-direction:column;align-items:flex-start;gap:8px;">
              <label class="cb-label"><input type="checkbox" data-field="material" value="求人票"><span class="cb-box"></span><span class="cb-text">求　人　票</span></label>
              <label class="cb-label"><input type="checkbox" data-field="material" value="企業案内"><span class="cb-box"></span><span class="cb-text">企　業　案　内</span></label>
              <label class="cb-label"><input type="checkbox" data-field="material" value="その他" onchange="toggleMaterialOther(this)"><span class="cb-box"></span><span class="cb-text">その　他</span></label>
            </div>
            <div class="field-group" id="materialOtherWrap" style="display:none;margin-top:10px;">
              <label>その他（内容）</label>
              <input type="text" id="f_materialOther" placeholder="その他の資料名">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 会社見学 & インターンシップ -->
    <div class="grid-2" style="gap:16px;">
      <div class="form-card">
        <div class="form-card-header">会社見学</div>
        <div class="form-card-body">
          <div class="radio-group">
            <label class="rb-label"><input type="radio" name="tour" id="tour_yes" value="有"><span class="rb-box"></span><span class="rb-text">有</span></label>
            <label class="rb-label"><input type="radio" name="tour" id="tour_no" value="無"><span class="rb-box"></span><span class="rb-text">無</span></label>
          </div>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-header">インターンシップ</div>
        <div class="form-card-body">
          <div class="radio-group">
            <label class="rb-label"><input type="radio" name="intern" id="intern_yes" value="有"><span class="rb-box"></span><span class="rb-text">有</span></label>
            <label class="rb-label"><input type="radio" name="intern" id="intern_no" value="無"><span class="rb-box"></span><span class="rb-text">無</span></label>
          </div>
        </div>
      </div>
    </div>

    <!-- 求める人材 & 企業アピール -->
    <div class="grid-2" style="gap:16px;">
      <div class="form-card">
        <div class="form-card-header">求める人材</div>
        <div class="form-card-body">
          <textarea id="f_talent" placeholder="求める人材の内容を入力" style="width:100%;min-height:100px;"></textarea>
        </div>
      </div>
      <div class="form-card">
        <div class="form-card-header">企業アピール</div>
        <div class="form-card-body">
          <textarea id="f_appeal" placeholder="企業アピールの内容を入力" style="width:100%;min-height:100px;"></textarea>
        </div>
      </div>
    </div>

    <!-- 備考 -->
    <div class="form-card">
      <div class="form-card-header">備　　考</div>
      <div class="form-card-body">
        <textarea id="f_note" placeholder="備考・特記事項を入力" style="width:100%;min-height:90px;"></textarea>
      </div>
    </div>

    <!-- BUTTONS -->
    <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;">
      <button class="btn btn-outline" onclick="resetForm()">🔄 リセット</button>
      <button class="btn btn-success" onclick="saveRecord()" id="saveBtn">💾 保存する</button>
    </div>
  </div>

  <!-- ===== LIST VIEW ===== -->
  <div class="view" id="view-list">
    <div class="stats-bar" id="statsBar"></div>

    <div class="list-controls">
      <input class="search-box" type="text" id="searchBox" placeholder="🔍 企業名・訪問者名・担当者で検索..." oninput="renderList()">
      <select class="btn btn-outline" onchange="filterCategory(this.value)" style="padding:8px 14px;">
        <option value="">すべて</option>
        <option value="就職">就職</option>
        <option value="進学">進学</option>
      </select>
      <button class="btn btn-primary" onclick="switchTab('form')">＋ 新規追加</button>
    </div>

    <div class="form-card">
      <div class="form-card-body" style="padding:0;overflow-x:auto;">
        <table class="records-table">
          <thead>
            <tr>
              <th class="sortable" onclick="setSort('receiptNo')" id="th-receiptNo">受付No <span class="sort-icon">↕</span></th>
              <th class="sortable" onclick="setSort('date')" id="th-date">日付 <span class="sort-icon">↓</span></th>
              <th>企業名</th>
              <th>訪問者</th>
              <th>担当者</th>
              <th>種別</th>
              <th>地区</th>
              <th style="text-align:center;">操作</th>
            </tr>
          </thead>
          <tbody id="recordsBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" style="display:none;">
          <div class="icon">📭</div>
          <p>記録がありません。「新規記録」から追加してください。</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Delete Modal -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <h3>🗑️ 記録を削除</h3>
    <p id="deleteModalMsg">この記録を削除してもよろしいですか？<br>削除した記録は元に戻せません。</p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeDeleteModal()">キャンセル</button>
      <button class="btn btn-danger" onclick="confirmDelete()">削除する</button>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const STORAGE_KEY = 'visitor_records_v2';
const WEEKDAYS = ['日','月','火','水','木','金','土'];
const REGIONS = ['鹿児島県','宮崎県','九州','関西','中京','関東','その他'];

let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let editingId = null;
let deleteTargetId = null;
let categoryFilter = '';
let sortKey = 'date';
let sortDir = 'desc'; // 最新順をデフォルト

// ===== INIT =====
function nextReceiptNo() {
  if (records.length === 0) return '0001';
  const max = records.reduce((m, r) => {
    const n = parseInt((r.receiptNo || '0').replace(/\D/g, ''), 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return String(max + 1).padStart(4, '0');
}

function init() {
  buildRegionTable();
  setToday();
  document.getElementById('f_receiptNo').value = nextReceiptNo();
  // 初期値：無
  document.getElementById('tour_no').checked = true;
  document.getElementById('intern_no').checked = true;
  REGIONS.forEach(r => {
    const dormNo = document.querySelector(`input[name="dorm_${r}"][data-dorm="無"]`);
    if (dormNo) dormNo.checked = true;
  });
  renderList();
  renderStats();
  document.getElementById('f_date').addEventListener('change', updateWeekday);
}

function buildRegionTable() {
  const tbody = document.getElementById('regionBody');
  REGIONS.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="text-align:left;">
        <label class="cb-label" style="border:none;padding:0;">
          <input type="checkbox" data-field="region" value="${r}" onchange="${r === 'その他' ? 'toggleRegionOther()' : ''}">
          <span class="cb-box"></span>
          <span class="cb-text">${r}</span>
        </label>
      </td>
      <td>
        <div style="display:flex;gap:10px;justify-content:center;align-items:center;">
          <label class="rb-label" style="border:none;padding:0;">
            <input type="radio" name="dorm_${r}" data-region="${r}" data-dorm="有">
            <span class="rb-box"></span>
            <span class="rb-text" style="font-size:0.82rem;">有</span>
          </label>
          <label class="rb-label" style="border:none;padding:0;">
            <input type="radio" name="dorm_${r}" data-region="${r}" data-dorm="無">
            <span class="rb-box"></span>
            <span class="rb-text" style="font-size:0.82rem;">無</span>
          </label>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

function setToday() {
  const today = new Date();
  document.getElementById('f_date').value = today.toISOString().slice(0,10);
  updateWeekday();
  document.getElementById('f_time').value = today.toTimeString().slice(0,5);
}

function updateWeekday() {
  const v = document.getElementById('f_date').value;
  if (!v) { document.getElementById('f_weekday').value = ''; return; }
  const d = new Date(v);
  document.getElementById('f_weekday').value = WEEKDAYS[d.getDay()] + '曜日';
}

// ===== TABS =====
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (tab==='form'?0:1)===i));
  document.getElementById('view-form').classList.toggle('active', tab==='form');
  document.getElementById('view-list').classList.toggle('active', tab==='list');
  if (tab==='list') { renderList(); renderStats(); }
}

// ===== COLLECT / FILL =====
function collectChecks(field) {
  return Array.from(document.querySelectorAll(`input[data-field="${field}"]:checked`)).map(c=>c.value);
}

function collectRegions() {
  const result = [];
  REGIONS.forEach(r => {
    const cb = document.querySelector(`input[data-field="region"][value="${r}"]`);
    if (cb && cb.checked) {
      const dormCb = document.querySelector(`input[name="dorm_${r}"]:checked`);
      result.push({ region: r, dorm: dormCb ? dormCb.dataset.dorm : '' });
    }
  });
  return result;
}

function getRecommendCount() {
  if (document.getElementById('rec1').checked) return '1';
  if (document.getElementById('rec2').checked) return '2';
  if (document.getElementById('recOtherCb').checked) return document.getElementById('f_recOther').value || 'その他';
  return '';
}

function collectForm() {
  return {
    id: editingId || Date.now().toString(),
    category: document.querySelector('input[name="category"]:checked')?.value || '就職',
    receiptNo: document.getElementById('f_receiptNo').value.trim(),
    handler: document.getElementById('f_handler').value.trim(),
    date: document.getElementById('f_date').value,
    weekday: document.getElementById('f_weekday').value,
    time: document.getElementById('f_time').value,
    company: document.getElementById('f_company').value.trim(),
    visitor: document.getElementById('f_visitor').value.trim(),
    regions: collectRegions(),
    regionOther: document.getElementById('f_regionOther').value.trim(),
    work: collectChecks('work'),
    gender: document.querySelector('input[name="gender"]:checked')?.value || '',
    recommendCount: getRecommendCount(),
    dept: collectChecks('dept'),
    material: collectChecks('material'),
    materialOther: document.getElementById('f_materialOther').value.trim(),
    tour: document.querySelector('input[name="tour"]:checked')?.value || '',
    intern: document.querySelector('input[name="intern"]:checked')?.value || '',
    talent: document.getElementById('f_talent').value.trim(),
    appeal: document.getElementById('f_appeal').value.trim(),
    note: document.getElementById('f_note').value.trim(),
    createdAt: editingId ? (records.find(r=>r.id===editingId)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
}

function fillForm(rec) {
  document.querySelector(`input[name="category"][value="${rec.category}"]`).checked = true;
  document.getElementById('f_receiptNo').value = rec.receiptNo || '';
  document.getElementById('f_handler').value = rec.handler || '';
  document.getElementById('f_date').value = rec.date || '';
  document.getElementById('f_weekday').value = rec.weekday || '';
  document.getElementById('f_time').value = rec.time || '';
  document.getElementById('f_company').value = rec.company || '';
  document.getElementById('f_visitor').value = rec.visitor || '';
  document.getElementById('f_regionOther').value = rec.regionOther || '';

  // Regions
  document.querySelectorAll('input[data-field="region"]').forEach(c => c.checked = false);
  document.querySelectorAll('input[data-dorm]').forEach(c => c.checked = false);
  (rec.regions||[]).forEach(r => {
    const cb = document.querySelector(`input[data-field="region"][value="${r.region}"]`);
    if (cb) cb.checked = true;
    if (r.dorm) {
      const dormCb = document.querySelector(`input[name="dorm_${r.region}"][data-dorm="${r.dorm}"]`);
      if (dormCb) dormCb.checked = true;
    }
  });

  ['work','dept','material'].forEach(field => {
    document.querySelectorAll(`input[data-field="${field}"]`).forEach(c => {
      c.checked = (rec[field]||[]).includes(c.value);
    });
  });

  // Recommend
  document.getElementById('rec1').checked = rec.recommendCount === '1';
  document.getElementById('rec2').checked = rec.recommendCount === '2';
  const isOther = rec.recommendCount && !['1','2'].includes(rec.recommendCount);
  document.getElementById('recOtherCb').checked = isOther;
  document.getElementById('f_recOther').value = isOther ? rec.recommendCount : '';
  toggleRecOther();

  if (rec.gender) { const r = document.querySelector(`input[name="gender"][value="${rec.gender}"]`); if (r) r.checked = true; }

  document.getElementById('f_materialOther').value = rec.materialOther || '';
  // その他チェック状態に応じて表示制御
  const matOtherCb = document.querySelector('input[data-field="material"][value="その他"]');
  document.getElementById('materialOtherWrap').style.display = (matOtherCb && matOtherCb.checked) ? 'block' : 'none';
  toggleRegionOther();

  if (rec.tour) { const r = document.querySelector(`input[name="tour"][value="${rec.tour}"]`); if (r) r.checked = true; }
  if (rec.intern) { const r = document.querySelector(`input[name="intern"][value="${rec.intern}"]`); if (r) r.checked = true; }

  document.getElementById('f_talent').value = rec.talent || '';
  document.getElementById('f_appeal').value = rec.appeal || '';
  document.getElementById('f_note').value = rec.note || '';
}

// ===== SAVE =====
function saveRecord() {
  const rec = collectForm();
  if (!rec.company) { showAlert('企業名を入力してください。', 'error'); return; }
  if (!rec.date) { showAlert('来訪日を入力してください。', 'error'); return; }

  if (editingId) {
    const idx = records.findIndex(r => r.id === editingId);
    if (idx >= 0) records[idx] = rec;
  } else {
    records.unshift(rec);
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  showAlert(editingId ? '✅ 記録を更新しました。' : '✅ 新しい記録を保存しました。', 'success');
  editingId = null;
  document.getElementById('saveBtn').textContent = '💾 保存する';
  resetForm();
  renderList();
  renderStats();
}

// ===== RESET =====
function resetForm() {
  editingId = null;
  document.getElementById('saveBtn').textContent = '💾 保存する';
  document.querySelector('input[name="category"][value="就職"]').checked = true;
  ['f_receiptNo','f_handler','f_company','f_visitor','f_regionOther','f_materialOther','f_talent','f_appeal','f_recOther','f_note'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.querySelectorAll('input[type="checkbox"]').forEach(c => c.checked = false);
  document.querySelectorAll('input[name="tour"], input[name="intern"], input[name="gender"]').forEach(r => r.checked = false);
  document.getElementById('tour_no').checked = true;
  document.getElementById('intern_no').checked = true;
  REGIONS.forEach(r => {
    const dormNo = document.querySelector(`input[name="dorm_${r}"][data-dorm="無"]`);
    if (dormNo) dormNo.checked = true;
  });
  document.getElementById('recOtherWrap').style.display = 'none';
  document.getElementById('materialOtherWrap').style.display = 'none';
  document.getElementById('regionOtherWrap').style.display = 'none';
  setToday();
  document.getElementById('formAlert').innerHTML = '';
  // 編集モードでない場合のみ採番
  if (!editingId) document.getElementById('f_receiptNo').value = nextReceiptNo();
}

// ===== EDIT =====
function editRecord(id) {
  const rec = records.find(r => r.id === id);
  if (!rec) return;
  editingId = id;
  fillForm(rec);
  document.getElementById('saveBtn').textContent = '✏️ 更新する';
  switchTab('form');
  window.scrollTo(0,0);
}

// ===== DELETE =====
function deleteRecord(id) {
  deleteTargetId = id;
  const rec = records.find(r => r.id === id);
  document.getElementById('deleteModalMsg').innerHTML = `<strong>${rec?.company || '（企業名なし）'}</strong> の記録を削除してもよろしいですか？<br>削除した記録は元に戻せません。`;
  document.getElementById('deleteModal').classList.add('open');
}
function closeDeleteModal() {
  document.getElementById('deleteModal').classList.remove('open');
  deleteTargetId = null;
}
function confirmDelete() {
  records = records.filter(r => r.id !== deleteTargetId);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  closeDeleteModal();
  renderList();
  renderStats();
}

// ===== FILTER =====
function filterCategory(val) { categoryFilter = val; renderList(); }

// ===== SORT =====
function setSort(key) {
  if (sortKey === key) {
    sortDir = sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    sortKey = key;
    sortDir = key === 'date' ? 'desc' : 'asc';
  }
  renderList();
}

function updateSortHeaders() {
  ['receiptNo', 'date'].forEach(key => {
    const th = document.getElementById(`th-${key}`);
    if (!th) return;
    const icon = th.querySelector('.sort-icon');
    if (sortKey === key) {
      th.classList.add('sort-active');
      icon.textContent = sortDir === 'asc' ? '↑' : '↓';
    } else {
      th.classList.remove('sort-active');
      icon.textContent = '↕';
    }
  });
}

// ===== RENDER LIST =====
function renderList() {
  const q = (document.getElementById('searchBox')?.value || '').toLowerCase();
  let filtered = records.filter(r => {
    const matchCat = !categoryFilter || r.category === categoryFilter;
    const matchQ = !q || [r.company,r.visitor,r.handler,r.receiptNo].some(v => (v||'').toLowerCase().includes(q));
    return matchCat && matchQ;
  });

  // ソート
  filtered.sort((a, b) => {
    let va, vb;
    if (sortKey === 'receiptNo') {
      va = parseInt((a.receiptNo || '0').replace(/\D/g, ''), 10) || 0;
      vb = parseInt((b.receiptNo || '0').replace(/\D/g, ''), 10) || 0;
    } else {
      va = (a.date || '') + (a.time || '');
      vb = (b.date || '') + (b.time || '');
    }
    if (va < vb) return sortDir === 'asc' ? -1 : 1;
    if (va > vb) return sortDir === 'asc' ? 1 : -1;
    return 0;
  });

  updateSortHeaders();

  const tbody = document.getElementById('recordsBody');
  const empty = document.getElementById('emptyState');
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  filtered.forEach((rec, i) => {
    const regionStr = (rec.regions||[]).map(r=>r.region).join('、') + (rec.regionOther ? `（${rec.regionOther}）` : '');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${rec.receiptNo||'—'}</td>
      <td style="white-space:nowrap;">${rec.date||'—'}<br><span style="font-size:0.75rem;color:var(--text-muted);">${rec.weekday||''} ${rec.time||''}</span></td>
      <td><strong>${rec.company||'—'}</strong></td>
      <td>${rec.visitor||'—'}</td>
      <td>${rec.handler||'—'}</td>
      <td><span class="badge ${rec.category==='就職'?'badge-employment':'badge-education'}">${rec.category||'—'}</span></td>
      <td style="font-size:0.8rem;">${regionStr||'—'}</td>
      <td>
        <div class="actions">
          <button class="btn btn-outline btn-sm" onclick="editRecord('${rec.id}')">✏️ 編集</button>
          <button class="btn btn-danger btn-sm" onclick="deleteRecord('${rec.id}')">🗑️</button>
        </div>
      </td>`;
    tbody.appendChild(tr);
  });
}

// ===== STATS =====
function renderStats() {
  const total = records.length;
  const emp = records.filter(r=>r.category==='就職').length;
  const edu = records.filter(r=>r.category==='進学').length;
  const today = new Date().toISOString().slice(0,10);
  const todayCount = records.filter(r=>r.date===today).length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">総記録数</div></div>
    <div class="stat-card"><div class="num" style="color:#1e40af;">${emp}</div><div class="lbl">就職</div></div>
    <div class="stat-card"><div class="num" style="color:#166534;">${edu}</div><div class="lbl">進学</div></div>
    <div class="stat-card"><div class="num" style="color:#92400e;">${todayCount}</div><div class="lbl">本日</div></div>`;
}

// ===== HELPERS =====
function showAlert(msg, type) {
  const el = document.getElementById('formAlert');
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => el.innerHTML = '', 4000);
}

function toggleMaterialOther(cb) {
  document.getElementById('materialOtherWrap').style.display = cb.checked ? 'block' : 'none';
  if (!cb.checked) document.getElementById('f_materialOther').value = '';
}

function toggleRegionOther() {
  const cb = document.querySelector('input[data-field="region"][value="その他"]');
  const show = cb && cb.checked;
  document.getElementById('regionOtherWrap').style.display = show ? 'block' : 'none';
  if (!show) document.getElementById('f_regionOther').value = '';
}

function toggleRecOther() {
  document.getElementById('recOtherWrap').style.display =
    document.getElementById('recOtherCb').checked ? 'block' : 'none';
}


// ===== EXPORT / IMPORT =====
function exportExcel() {
  if (records.length === 0) { alert('エクスポートするデータがありません。'); return; }

  const headers = [
    '受付No', '来訪日', '曜日', '来訪時刻', '種別',
    '企業名', '訪問者氏名', '担当応対者',
    '地区', '寮の有無',
    '業務内容', '性別', '推薦人数', '募集・学科',
    '資料等', 'その他資料',
    '会社見学', 'インターンシップ',
    '求める人材', '企業アピール', '備考'
  ];

  const rows = records.map(r => {
    const regionNames = (r.regions||[]).map(x => x.region).join('・');
    const dormInfo = (r.regions||[]).filter(x=>x.dorm).map(x=>`${x.region}:${x.dorm}`).join('・');
    return [
      r.receiptNo || '',
      r.date || '',
      r.weekday || '',
      r.time || '',
      r.category || '',
      r.company || '',
      r.visitor || '',
      r.handler || '',
      [regionNames, r.regionOther].filter(Boolean).join('・'),
      dormInfo,
      (r.work||[]).join('・'),
      r.gender || '',
      r.recommendCount || '',
      (r.dept||[]).join('・'),
      (r.material||[]).join('・'),
      r.materialOther || '',
      r.tour || '',
      r.intern || '',
      r.talent || '',
      r.appeal || '',
      r.note || ''
    ];
  });

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);

  // 列幅の設定
  ws['!cols'] = [
    {wch:10},{wch:12},{wch:6},{wch:8},{wch:6},
    {wch:22},{wch:14},{wch:12},
    {wch:18},{wch:18},
    {wch:30},{wch:10},{wch:8},{wch:16},
    {wch:16},{wch:14},
    {wch:10},{wch:14},
    {wch:28},{wch:28},{wch:28}
  ];

  // ヘッダー行のスタイル
  headers.forEach((_, ci) => {
    const cellRef = XLSX.utils.encode_cell({r:0, c:ci});
    if (!ws[cellRef]) return;
    ws[cellRef].s = {
      font: { bold: true, color: { rgb: 'FFFFFF' } },
      fill: { fgColor: { rgb: '1A3A5C' } },
      alignment: { horizontal: 'center', vertical: 'center', wrapText: true },
      border: {
        top:    { style:'thin', color:{rgb:'AAAAAA'} },
        bottom: { style:'thin', color:{rgb:'AAAAAA'} },
        left:   { style:'thin', color:{rgb:'AAAAAA'} },
        right:  { style:'thin', color:{rgb:'AAAAAA'} }
      }
    };
  });

  // データ行のスタイル（交互背景）
  rows.forEach((_, ri) => {
    const bg = ri % 2 === 0 ? 'FFFFFF' : 'F5F2EB';
    headers.forEach((__, ci) => {
      const cellRef = XLSX.utils.encode_cell({r: ri+1, c: ci});
      if (!ws[cellRef]) ws[cellRef] = {v:'', t:'s'};
      ws[cellRef].s = {
        fill: { fgColor: { rgb: bg } },
        alignment: { vertical: 'center', wrapText: true },
        border: {
          top:    { style:'thin', color:{rgb:'E0D8C8'} },
          bottom: { style:'thin', color:{rgb:'E0D8C8'} },
          left:   { style:'thin', color:{rgb:'E0D8C8'} },
          right:  { style:'thin', color:{rgb:'E0D8C8'} }
        }
      };
    });
  });

  XLSX.utils.book_append_sheet(wb, ws, '来訪者応接記録');
  XLSX.writeFile(wb, `来訪者応接記録_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(records, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `来訪者応接記録_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error();
      records = data;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
      renderList(); renderStats();
      alert(`✅ ${data.length} 件の記録をインポートしました。`);
    } catch {
      alert('❌ JSONファイルの読み込みに失敗しました。');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

init();
